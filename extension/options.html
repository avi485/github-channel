<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ask Claude settings</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --bg: #fff; --accent: #d97757; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f0f6fc; --muted: #9198a1; --border: #3d444d; --bg: #0d1117; } }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); max-width: 640px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; }
    p, li { color: var(--muted); }
    code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: color-mix(in srgb, var(--muted) 15%, transparent); padding: 1px 4px; border-radius: 4px; }
    input { width: 100%; box-sizing: border-box; font: 13px ui-monospace, Menlo, monospace; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--fg); }
    button { margin-top: 8px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: var(--fg); }
    #status { margin-left: 8px; color: var(--muted); }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    td, th { text-align: left; border-bottom: 1px solid var(--border); padding: 6px 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Ask Claude for GitHub PRs</h1>

  <h2>Pairing token</h2>
  <p>Run <code>pbcopy &lt; ~/.config/github-channel/token</code> and paste here.</p>
  <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Pairing token">
  <button id="save">Save</button><span id="status"></span>

  <h2>Service</h2>
  <p>Start it with <code>bun start</code> in <code>github-channel/server</code>. It answers for any repo cloned under
    <code>~/projects</code>, or mapped in <code>~/.config/github-channel/repos.json</code>.</p>
  <button id="refresh" class="secondary">Refresh</button> <span id="service"></span>
  <table>
    <thead><tr><th>Repos with a local clone</th></tr></thead>
    <tbody id="repos"></tbody>
  </table>

  <script src="options.js"></script>
</body>
</html>
